plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = "levelmod"
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"levelmod" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// GameplayMod (персонажи, CharacterPose): собранный jar лежит рядом. Пересобирайте его (./gradlew jar в GameplayMod) перед сборкой этого мода.
	implementation files("../GameplayMod/build/libs/gameplaymod-1.0.0.jar")
	// BehaviorMod (напарник, приказы, окно реплик): так же, пересобирайте его перед сборкой этого мода.
	implementation files("../BehaviorMod/build/libs/behaviormod-1.0.0.jar")
	// BuildMod (рисование контура, OutlineDrawing): так же, пересобирайте его перед сборкой этого мода.
	implementation files("../BuildMod/build/libs/buildmod-1.0.0.jar")
	// версии мира: возврат блоков читает текущую версию через API
	implementation files("../SmesharikiMod/build/libs/smesharikimod-1.0.0.jar")
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
